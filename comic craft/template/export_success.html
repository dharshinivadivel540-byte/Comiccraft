<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Export Complete - ComicCraft
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="shell centered">

    <section class="card success">

        <div class="check">
            ✓
        </div>

        <p class="eyebrow">
            EXPORT COMPLETE
        </p>

        <h1>
            Your Comic Is Ready
        </h1>

        <p>
            Your ComicCraft PDF export has been
            completed successfully.
        </p>

        <a
            class="button"
            href="/"
        >
            Go Create Another Comic
        </a>

    </section>

</main>

</body>
</html>
